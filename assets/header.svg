<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2a44" stroke-width="1" opacity="0.45"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
      .star{fill:#e6edf3;animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .role{opacity:0;animation:role 16s infinite}
      .r2{animation-delay:4s}.r3{animation-delay:8s}.r4{animation-delay:12s}
      @keyframes role{0%{opacity:0;transform:translateY(10px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .fade{opacity:0;animation:fade 1.2s ease-out forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
      @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- aurora blobs -->
    <g filter="url(#blur)" opacity="0.55">
      <ellipse cx="250" cy="90" rx="260" ry="110" fill="#2dd4bf">
        <animateTransform attributeName="transform" type="translate" values="0 0;90 30;0 0" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="640" cy="40" rx="280" ry="100" fill="#8b5cf6">
        <animateTransform attributeName="transform" type="translate" values="0 0;-80 40;0 0" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1000" cy="110" rx="240" ry="110" fill="#ec4899">
        <animateTransform attributeName="transform" type="translate" values="0 0;-70 -20;0 0" dur="12s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- stars -->
    <circle class="star" cx="90" cy="60" r="1.6"/>
    <circle class="star" cx="180" cy="250" r="1.2" style="animation-delay:.7s"/>
    <circle class="star" cx="330" cy="40" r="1.4" style="animation-delay:1.4s"/>
    <circle class="star" cx="470" cy="290" r="1.2" style="animation-delay:2.1s"/>
    <circle class="star" cx="760" cy="30" r="1.5" style="animation-delay:.4s"/>
    <circle class="star" cx="880" cy="280" r="1.3" style="animation-delay:1.8s"/>
    <circle class="star" cx="1050" cy="50" r="1.6" style="animation-delay:1.1s"/>
    <circle class="star" cx="1130" cy="240" r="1.2" style="animation-delay:2.4s"/>
    <circle class="star" cx="60" cy="180" r="1.1" style="animation-delay:2.8s"/>
    <circle class="star" cx="1160" cy="150" r="1.4" style="animation-delay:.9s"/>

    <!-- hello -->
    <text class="mono fade" x="600" y="88" text-anchor="middle" font-size="18" fill="#8b98b0" letter-spacing="4">HELLO WORLD, I'M</text>

    <!-- name -->
    <text class="sans fade d1" x="600" y="160" text-anchor="middle" font-size="72" font-weight="800" fill="url(#name)" filter="url(#glow)" letter-spacing="1">S Vimaladharsan</text>

    <rect class="fade d2" x="380" y="184" width="440" height="2" fill="url(#line)"/>

    <!-- rotating roles -->
    <g class="mono" font-size="24" fill="#e6edf3">
      <text x="600" y="232" text-anchor="middle" class="role"><tspan fill="#2dd4bf">&gt;</tspan> Full-Stack Engineer</text>
      <text x="600" y="232" text-anchor="middle" class="role r2"><tspan fill="#8b5cf6">&gt;</tspan> AI Agent &amp; MCP Developer</text>
      <text x="600" y="232" text-anchor="middle" class="role r3"><tspan fill="#ec4899">&gt;</tspan> Security-First Backend Builder</text>
      <text x="600" y="232" text-anchor="middle" class="role r4"><tspan fill="#2dd4bf">&gt;</tspan> React &amp; Angular Craftsman</text>
    </g>

    <!-- pills -->
    <g class="sans fade d3" font-size="15" fill="#c9d1d9">
      <rect x="318" y="268" width="186" height="34" rx="17" fill="#111a2e" stroke="#2dd4bf" stroke-opacity="0.5"/>
      <text x="411" y="290" text-anchor="middle">🎓 B.Tech CSE · Amrita</text>
      <rect x="518" y="268" width="164" height="34" rx="17" fill="#111a2e" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="600" y="290" text-anchor="middle">📍 Coimbatore, India</text>
      <rect x="696" y="268" width="186" height="34" rx="17" fill="#111a2e" stroke="#ec4899" stroke-opacity="0.5"/>
      <text x="789" y="290" text-anchor="middle"><tspan fill="#2dd4bf">●</tspan> Open to internships</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#1e2a44"/>
</svg>
