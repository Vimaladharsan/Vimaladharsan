<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="6" y="6" width="282" height="158" rx="18"/></clipPath>
    <clipPath id="c2"><rect x="306" y="6" width="282" height="158" rx="18"/></clipPath>
    <clipPath id="c3"><rect x="606" y="6" width="282" height="158" rx="18"/></clipPath>
    <clipPath id="c4"><rect x="906" y="6" width="282" height="158" rx="18"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .num{font-size:52px;font-weight:800}
      .lbl{font-size:15px;font-weight:700;letter-spacing:2.5px;fill:#e6edf3}
      .sub{font-size:14px;fill:#8b98b0}
      .card{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
      .k2{animation-delay:.15s}.k3{animation-delay:.3s}.k4{animation-delay:.45s}
      @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g class="sans">
    <g class="card">
      <rect x="6" y="6" width="282" height="158" rx="18" fill="#0d1424" stroke="url(#g)" stroke-opacity="0.6" stroke-width="1.5"/>
      <g clip-path="url(#c1)"><rect x="-300" y="0" width="200" height="170" fill="url(#sweep)"><animate attributeName="x" values="-300;1300" dur="5s" repeatCount="indefinite"/></rect></g>
      <text x="147" y="78" text-anchor="middle" class="num" fill="url(#g)">10+</text>
      <text x="147" y="112" text-anchor="middle" class="lbl">PROJECTS BUILT</text>
      <text x="147" y="138" text-anchor="middle" class="sub">web · AI · desktop · extension</text>
    </g>
    <g class="card k2">
      <rect x="306" y="6" width="282" height="158" rx="18" fill="#0d1424" stroke="url(#g)" stroke-opacity="0.6" stroke-width="1.5"/>
      <g clip-path="url(#c2)"><rect x="-300" y="0" width="200" height="170" fill="url(#sweep)"><animate attributeName="x" values="-300;1300" dur="5s" begin="0.4s" repeatCount="indefinite"/></rect></g>
      <text x="447" y="78" text-anchor="middle" class="num" fill="url(#g)">3</text>
      <text x="447" y="112" text-anchor="middle" class="lbl">AI PRODUCTS</text>
      <text x="447" y="138" text-anchor="middle" class="sub">agents · NLP · LLM apps</text>
    </g>
    <g class="card k3">
      <rect x="606" y="6" width="282" height="158" rx="18" fill="#0d1424" stroke="url(#g)" stroke-opacity="0.6" stroke-width="1.5"/>
      <g clip-path="url(#c3)"><rect x="-300" y="0" width="200" height="170" fill="url(#sweep)"><animate attributeName="x" values="-300;1300" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect></g>
      <text x="747" y="78" text-anchor="middle" class="num" fill="url(#g)">14</text>
      <text x="747" y="112" text-anchor="middle" class="lbl">MCP TOOLS</text>
      <text x="747" y="138" text-anchor="middle" class="sub">in one production AI agent</text>
    </g>
    <g class="card k4">
      <rect x="906" y="6" width="282" height="158" rx="18" fill="#0d1424" stroke="url(#g)" stroke-opacity="0.6" stroke-width="1.5"/>
      <g clip-path="url(#c4)"><rect x="-300" y="0" width="200" height="170" fill="url(#sweep)"><animate attributeName="x" values="-300;1300" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect></g>
      <text x="1047" y="78" text-anchor="middle" class="num" fill="url(#g)">161</text>
      <text x="1047" y="112" text-anchor="middle" class="lbl">TEST ASSERTIONS</text>
      <text x="1047" y="138" text-anchor="middle" class="sub">in a single codebase</text>
    </g>
  </g>
</svg>
