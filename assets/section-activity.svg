<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110">
  <defs>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <style>
      .grow{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards;transform-origin:0 0;transform:scaleX(0)}
      @keyframes grow{to{transform:scaleX(1)}}
      .in{opacity:0;animation:in .9s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
    </style>
  </defs>
  <g class="in">
    <text x="4" y="30" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace" font-size="16" letter-spacing="3" fill="#2dd4bf">06 — LANGUAGES AND CONTRIBUTIONS</text>
    <text x="0" y="78" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="url(#au)">Code Activity</text>
  </g>
  <rect class="grow" x="2" y="96" width="1196" height="3" rx="1.5" fill="url(#au)" opacity="0.85"/>
</svg>
